<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-porter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="beer-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B1E12" />
      <stop offset="100%" stop-color="#1F110B" />
    </linearGradient>
    <linearGradient id="foam-tan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E9D5B4" />
      <stop offset="100%" stop-color="#CBB38D" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg-porter)" />
  <circle cx="300" cy="200" r="130" fill="#D97796" opacity="0.15" />
  <circle cx="300" cy="200" r="95" fill="#F59E0B" opacity="0.1" />

  <!-- Snifter Glass -->
  <g transform="translate(240, 95)">
    <!-- Stem and Base -->
    <path d="M 40,210 L 80,210 L 70,175 L 50,175 Z" fill="#64748B" opacity="0.7" />
    <!-- Bowl -->
    <path d="M 20,60 C -5,120 30,175 60,175 C 90,175 125,120 100,60 Z" fill="url(#beer-dark)" />
    <!-- Glass Rim Highlights -->
    <path d="M 22,65 C 5,115 32,165 58,168" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.3" />
    <!-- Tan Dense Foam -->
    <ellipse cx="60" cy="62" rx="40" ry="12" fill="url(#foam-tan)" />
    <path d="M 22,62 Q 40,50 60,54 Q 80,50 98,62 Z" fill="#F7EEDB" />
    <!-- Smoke Tendrils -->
    <path d="M 50,45 Q 40,30 55,18 T 50,5" stroke="#FAF8F5" stroke-width="2" fill="none" opacity="0.35" stroke-linecap="round" />
    <path d="M 70,45 Q 80,30 68,18 T 72,5" stroke="#FAF8F5" stroke-width="2.5" fill="none" opacity="0.4" stroke-linecap="round" />
  </g>

  <text x="300" y="345" text-anchor="middle" fill="#FAF8F5" font-family="'Montserrat', sans-serif" font-weight="800" font-size="20" letter-spacing="3">SMOKED BALTIC PORTER</text>
  <text x="300" y="370" text-anchor="middle" fill="#D97796" font-family="sans-serif" font-weight="600" font-size="13" letter-spacing="1.5">7.0% ABV · THE HIGHLAND CASK</text>
</svg>
