<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sky-ordesa" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#2D6A4F" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sky-ordesa)" />

  <!-- Sun / Compass Dial -->
  <circle cx="300" cy="170" r="120" fill="#F59E0B" opacity="0.15" />
  <circle cx="300" cy="170" r="80" fill="#FAF8F5" opacity="0.1" />

  <!-- Massive Ordesa Canyon Mountain Walls (Monte Perdido) -->
  <polygon points="20,290 140,80 260,290" fill="#1B4332" />
  <polygon points="140,80 180,120 150,130 140,80" fill="#FAF8F5" opacity="0.8" />

  <polygon points="340,290 460,95 580,290" fill="#0F172A" />
  <polygon points="460,95 440,130 470,125 460,95" fill="#FAF8F5" opacity="0.8" />

  <!-- Center Peak (Monte Perdido) -->
  <polygon points="180,290 300,50 420,290" fill="#2D6A4F" />
  <!-- Snow Cap -->
  <polygon points="300,50 280,85 295,80 300,95 310,82 322,88" fill="#FAF8F5" />

  <!-- Canyon Floor & Winding Trail -->
  <path d="M 0,285 Q 150,270 300,285 T 600,285 L 600,400 L 0,400 Z" fill="#1B4332" />
  <!-- Dotted Hiker Trail -->
  <path d="M 120,310 Q 220,280 280,240 T 300,180" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="6 6" />

  <!-- Hiker Silhouette -->
  <g transform="translate(285, 175) scale(0.65)">
    <!-- Head -->
    <circle cx="20" cy="10" r="7" fill="#FAF8F5" />
    <!-- Backpack -->
    <rect x="2" y="20" width="12" height="24" rx="4" fill="#D97796" />
    <!-- Torso -->
    <polygon points="12,18 28,18 24,46 16,46" fill="#FAF8F5" />
    <!-- Legs & Trekking Poles -->
    <line x1="17" y1="46" x2="10" y2="70" stroke="#FAF8F5" stroke-width="4" stroke-linecap="round" />
    <line x1="23" y1="46" x2="32" y2="68" stroke="#FAF8F5" stroke-width="4" stroke-linecap="round" />
    <line x1="8" y1="30" x2="5" y2="72" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" />
    <line x1="30" y1="30" x2="38" y2="70" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <text x="300" y="355" text-anchor="middle" fill="#FAF8F5" font-family="'Montserrat', sans-serif" font-weight="800" font-size="20" letter-spacing="3">CAÑÓN DE ORDESA &amp; GÓRIZ</text>
  <text x="300" y="380" text-anchor="middle" fill="#F59E0B" font-family="sans-serif" font-weight="600" font-size="13" letter-spacing="1.5">18.5 KM · +1,150 M · PIRINEOS HUESCA</text>
</svg>
