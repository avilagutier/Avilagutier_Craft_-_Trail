<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" role="img" aria-label="Logo Avilagutier - El Pin Alpino">
  <defs>
    <!-- Trayectoria circular superior para el texto -->
    <path id="topArc-1-light-false" d="M 32,120 A 88,88 0 1,1 208,120" />
    <!-- Máscara interior del pin -->
    <clipPath id="pinClip-1-light-false">
      <path d="M 120,42 C 85,42 58,69 58,103 C 58,144 103,182 116,195 C 118.2,197.2 121.8,197.2 124,195 C 137,182 182,144 182,103 C 182,69 155,42 120,42 Z" />
    </clipPath>
  </defs>

  <!-- Anillo exterior fino -->
  <circle cx="120" cy="120" r="108" fill="none" stroke="#0F172A" stroke-width="1.75" stroke-opacity="0.35" />
  <circle cx="120" cy="120" r="102" fill="none" stroke="#D97706" stroke-width="1" stroke-dasharray="2 4" />

  <!-- Tipografía curvada superior: AVILAGUTIER -->
  <text fill="#0F172A" font-family="'Montserrat', 'Inter', sans-serif" font-size="13.5" font-weight="800" letter-spacing="4.2">
    <textPath href="#topArc-1-light-false" startOffset="50%" text-anchor="middle">AVILAGUTIER</textPath>
  </text>

  <!-- Puntos cardinales laterales decorativos -->
  <circle cx="31" cy="126" r="2.2" fill="#D97706" />
  <circle cx="209" cy="126" r="2.2" fill="#D97706" />

  <!-- Interior recortado en forma de Pin de Mapa -->
  <g clip-path="url(#pinClip-1-light-false)">
    <!-- Cielo / Fondo superior del pin -->
    <rect x="50" y="38" width="140" height="92" fill="#1B4332" fill-opacity="0.18" />

    <!-- Cordillera Alpina (Montaña trasera y principal) -->
    <polygon points="54,126 94,76 132,126" fill="#1B4332" />
    <polygon points="88,126 126,66 168,126" fill="#0F172A" />
    <!-- Nieve geométrica en la cumbre -->
    <polygon points="126,66 114,84 121,81 126,87 132,80 139,84" fill="#FAF8F5" />

    <!-- Base líquida de cerveza ámbar formando el vértice del pin -->
    <rect x="54" y="132" width="132" height="70" fill="#D97706" />
    <!-- Reflejo vertical sutil de la pinta -->
    <path d="M 96,136 L 103,190 L 111,190 L 106,136 Z" fill="#F59E0B" opacity="0.65" />

    <!-- Franja de Espuma Geométrica que separa montaña y cerveza -->
    <path d="M 52,122 Q 72,115 92,122 T 132,122 T 188,122 L 188,135 L 52,135 Z" fill="#FAF8F5" />
    <line x1="54" y1="135" x2="186" y2="135" stroke="#0F172A" stroke-width="2" />
  </g>

  <!-- Contorno maestro del Pin de Mapa -->
  <path d="M 120,42 C 85,42 58,69 58,103 C 58,144 103,182 116,195 C 118.2,197.2 121.8,197.2 124,195 C 137,182 182,144 182,103 C 182,69 155,42 120,42 Z"
        fill="none" stroke="#0F172A" stroke-width="4.5" stroke-linejoin="round" />

  <!-- Pequeña estrella / brújula en la base inferior del anillo -->
  <path d="M 120,205 L 122,210 L 127,212 L 122,214 L 120,219 L 118,214 L 113,212 L 118,210 Z" fill="#D97706" />
</svg>