<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-munich" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4332" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg-munich)" />

  <!-- City Skyline Silhouette (Frauenkirche Towers) -->
  <g transform="translate(160, 90)" fill="#2D6A4F" opacity="0.65">
    <rect x="90" y="50" width="30" height="120" />
    <path d="M 85,50 C 85,30 125,30 125,50 Z" />
    <rect x="150" y="50" width="30" height="120" />
    <path d="M 145,50 C 145,30 185,30 185,50 Z" />
    <!-- City Hall Spire -->
    <polygon points="40,170 60,30 80,170" />
    <polygon points="190,170 215,60 240,170" />
  </g>

  <!-- Big Bavarian Beer Stein / Masskrug in foreground -->
  <g transform="translate(250, 130)">
    <!-- Mug Handle -->
    <path d="M 90,40 C 135,40 135,110 90,110" fill="none" stroke="#FAF8F5" stroke-width="12" stroke-linecap="round" opacity="0.8" />
    <!-- Glass Dimpled Body -->
    <rect x="15" y="20" width="80" height="115" rx="10" fill="#F59E0B" opacity="0.9" />
    <!-- Glass Facets / Dimples -->
    <rect x="25" y="35" width="14" height="25" rx="4" fill="#FAF8F5" opacity="0.4" />
    <rect x="48" y="35" width="14" height="25" rx="4" fill="#FAF8F5" opacity="0.4" />
    <rect x="71" y="35" width="14" height="25" rx="4" fill="#FAF8F5" opacity="0.4" />
    <rect x="25" y="75" width="14" height="30" rx="4" fill="#D97706" opacity="0.7" />
    <rect x="48" y="75" width="14" height="30" rx="4" fill="#D97706" opacity="0.7" />
    <rect x="71" y="75" width="14" height="30" rx="4" fill="#D97706" opacity="0.7" />
    <!-- Overflowing Foam -->
    <path d="M 10,24 Q 25,2 55,8 Q 85,2 100,24 Q 105,35 95,35 L 15,35 Q 5,35 10,24 Z" fill="#FAF8F5" />
    <!-- Pretzel Accent -->
    <g transform="translate(-45, 45) scale(0.65)">
      <path d="M 40,30 C 15,30 10,65 30,85 C 50,105 70,85 70,85 C 70,85 90,105 110,85 C 130,65 125,30 100,30 C 70,30 70,65 70,65 C 70,65 70,30 40,30 Z" fill="none" stroke="#D97796" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <text x="300" y="345" text-anchor="middle" fill="#FAF8F5" font-family="'Montserrat', sans-serif" font-weight="800" font-size="20" letter-spacing="3">MÚNICH TECH &amp; BIERGARTENS</text>
  <text x="300" y="370" text-anchor="middle" fill="#D97796" font-family="sans-serif" font-weight="600" font-size="13" letter-spacing="1.5">ALEMANIA · VIAJE DE TRABAJO</text>
</svg>
