<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sky-bergen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E3A5F" />
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142C44" />
      <stop offset="100%" stop-color="#0A1826" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sky-bergen)" />

  <!-- Mountains in background -->
  <polygon points="0,220 110,130 220,220" fill="#1B4332" opacity="0.6" />
  <polygon points="180,220 290,110 400,220" fill="#2D6A4F" opacity="0.7" />
  <polygon points="340,220 480,95 600,220" fill="#1B4332" opacity="0.5" />
  <polygon points="480,95 460,120 475,115 480,125 490,116 502,122" fill="#FAF8F5" opacity="0.8" />

  <!-- Fjord Water -->
  <rect y="215" width="600" height="185" fill="url(#water)" />
  <ellipse cx="300" cy="225" rx="280" ry="8" fill="#2D6A4F" opacity="0.2" />

  <!-- Traditional Bryggen Wooden Houses -->
  <g transform="translate(130, 160)">
    <!-- House 1: Red/Malta -->
    <polygon points="0,55 35,20 70,55" fill="#D97796" />
    <rect x="5" y="55" width="60" height="50" fill="#D97796" />
    <rect x="25" y="70" width="20" height="35" fill="#0F172A" />
    <rect x="15" y="38" width="12" height="12" fill="#FAF8F5" />
    <rect x="43" y="38" width="12" height="12" fill="#FAF8F5" />

    <!-- House 2: Amber/Gold -->
    <polygon points="75,55 110,15 145,55" fill="#F59E0B" />
    <rect x="80" y="55" width="60" height="50" fill="#F59E0B" />
    <rect x="100" y="75" width="20" height="30" fill="#0F172A" />
    <rect x="90" y="36" width="14" height="14" fill="#FAF8F5" />
    <rect x="116" y="36" width="14" height="14" fill="#FAF8F5" />

    <!-- House 3: Forest Green -->
    <polygon points="150,55 185,25 220,55" fill="#1B4332" />
    <rect x="155" y="55" width="60" height="50" fill="#1B4332" />
    <rect x="175" y="72" width="20" height="33" fill="#0F172A" />
    <rect x="165" y="40" width="12" height="12" fill="#FAF8F5" />
    <rect x="193" y="40" width="12" height="12" fill="#FAF8F5" />

    <!-- House 4: Off-white -->
    <polygon points="225,55 260,18 295,55" fill="#FAF8F5" />
    <rect x="230" y="55" width="60" height="50" fill="#FAF8F5" />
    <rect x="250" y="75" width="20" height="30" fill="#0F172A" />
    <rect x="240" y="36" width="14" height="14" fill="#D97796" />
    <rect x="266" y="36" width="14" height="14" fill="#D97796" />
  </g>

  <!-- Reflection in water -->
  <rect x="135" y="270" width="60" height="20" fill="#D97796" opacity="0.3" rx="4" />
  <rect x="210" y="270" width="60" height="25" fill="#F59E0B" opacity="0.3" rx="4" />
  <rect x="285" y="270" width="60" height="20" fill="#1B4332" opacity="0.3" rx="4" />

  <text x="300" y="345" text-anchor="middle" fill="#FAF8F5" font-family="'Montserrat', sans-serif" font-weight="800" font-size="20" letter-spacing="3">FIORDOS &amp; CERVEZAS EN BERGEN</text>
  <text x="300" y="370" text-anchor="middle" fill="#F59E0B" font-family="sans-serif" font-weight="600" font-size="13" letter-spacing="1.5">NORUEGA · RUTA DE PLACER</text>
</svg>
